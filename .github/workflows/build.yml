
name: Build Project

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native_lib/go.mod
          cache: false

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.3
          cache: true
          pub-cache: true

      - name: Check toolchains
        shell: bash
        run: |
          echo "Architecture:"
          uname -m
          echo "Go:"
          go version
          echo "Flutter:"
          flutter --version
          echo "NDK:"
          echo "${ANDROID_NDK_HOME}"
          test -d "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/darwin-x86_64"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android App
        shell: bash
        run: bash build_android.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build iOS App
        shell: bash
        run: bash build_ios.sh

      - name: Verify build outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f wiiudownloader.ipa
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh wiiudownloader.ipa

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-iOS
          path: wiiudownloader.ipa
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lah ./release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./release-assets/app-release.apk#WiiUDownloader.apk \
            ./release-assets/wiiudownloader.ipa#WiiUDownloader.ipa \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "WiiUDownloader build"
