name: Build Project

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: native_lib/go.mod
          cache: false

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.41.3

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android App
        run: zsh build_android.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build iOS App
        run: zsh build_ios.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiUDownloader-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiUDownloader-iOS
          path: wiiudownloader.ipa
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lah ./release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./release-assets/app-release.apk#WiiUDownloader.apk \
            ./release-assets/wiiudownloader.ipa#WiiUDownloader.ipa \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "WiiUDownloader build"

