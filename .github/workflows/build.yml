name: Build Project

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native_lib/go.mod
          cache: false

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.3
          cache: true
          pub-cache: true

      - name: Check toolchains
        shell: bash
        run: |
          echo "Architecture:"
          uname -m
          echo "Go:"
          go version
          echo "Flutter:"
          flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS App
        shell: bash
        run: bash build_ios.sh

      - name: Verify iOS build output
        run: |
          test -f wiiudownloader.ipa
          ls -lh wiiudownloader.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-iOS
          path: wiiudownloader.ipa
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v7
        with:
          name: WiiUDownloader-iOS
          path: ./release-assets

      - name: Display downloaded files
        run: ls -lah ./release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./release-assets/wiiudownloader.ipa#WiiUDownloader.ipa \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "WiiUDownloader iOS build"
